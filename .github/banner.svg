<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="rnd-skill: a living thesis ledger for AI research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a33d"/>
      <stop offset="1" stop-color="#7fd18c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1c2230" stroke-width="1">
    <line x1="0" y1="100" x2="1280" y2="100"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
  </g>

  <!-- left: name + tagline -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="72" y="150" font-size="88" font-weight="700" fill="#e6e9ef">/rnd</text>
    <text x="72" y="196" font-size="19" fill="#8b93a7">research, interrogate, then commit to an argument</text>
    <text x="72" y="252" font-size="17" fill="#5c657a">one living thesis per idea &#183; re-check falsifiers,</text>
    <text x="72" y="278" font-size="17" fill="#5c657a">never re-research the world &#183; yield beside cost</text>
    <text x="72" y="330" font-size="15" fill="#e8a33d">verdict: go / reshape / no-go + the one condition that flips it</text>
  </g>

  <!-- right: ledger card -->
  <g transform="translate(700,52)">
    <rect x="0" y="0" width="512" height="296" rx="10" fill="#0f1420" stroke="#242c3d"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
      <text x="24" y="34" fill="#8b93a7">&#167;C CLAIMS</text>
      <text x="24" y="64" fill="#7fd18c">C1*  V  world     rivals bundle it free</text>
      <text x="24" y="90" fill="#7fd18c">C2*  V  world     driver = should, not must</text>
      <text x="24" y="116" fill="#d8873a">C3   A  customer  users will pay us</text>
      <text x="24" y="146" fill="#8b93a7">&#167;F FLIPS</text>
      <text x="24" y="172" fill="#c5cad6">F2  8+ warm intros book -&gt; go   [untested]</text>
      <text x="24" y="206" fill="#e05d5d">&#9888; demand-UNVALIDATED: 0 verified by buyer contact</text>
    </g>
    <!-- cost curve -->
    <g transform="translate(24,224)">
      <text x="0" y="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b93a7">cost per run</text>
      <path d="M 0 24 L 110 24 L 150 48 L 464 50" fill="none" stroke="url(#curve)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="24" r="4" fill="#e8a33d"/>
      <circle cx="464" cy="50" r="4" fill="#7fd18c"/>
      <text x="8" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#e8a33d">run 1: 100%</text>
      <text x="368" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7fd18c">run 2: 5.3%</text>
    </g>
  </g>
</svg>
